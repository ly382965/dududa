name: astrbot_plugin_proactive_chatter
display_name: 择机闲聊
desc: 检测群里热闹程度，低频率主动插话；结合嘟嘟哒人设与活跃群友风格生成贴合话题的简短发言。
help: |
  插件持续记录群消息，当某群在窗口时间内(默认2分钟)消息数达到阈值(默认15条)时，
  以较低概率主动插入一句贴合当前话题的话，并带一点点最活跃群友的风格。
  全局最低间隔默认6分钟，每群至少10分钟才可能再发言，避免刷屏。
  可在插件配置页调整触发概率、热闹阈值、冷却时间和启停。
version: v0.1.0
author: mmdustc
repo: https://github.com/ly382965/dududa/tree/main/plugins/astrbot_plugin_proactive_chatter
support_platforms:
  - aiocqhttp
