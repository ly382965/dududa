[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dududa-runtime"
version = "3.1.18"
description = "Dududa rule-first bot host with an omp (GPT-5.6 Luna MAX) agent harness"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
dududa-v3 = "dududa_v3.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dududa_v3 = ["assets/*.png"]
