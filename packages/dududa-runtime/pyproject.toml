[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dududa-runtime"
version = "3.0.0"
description = "Dududa rule-first bot host backed by the local Codex CLI"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.scripts]
dududa-v3 = "dududa_v3.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
