name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.20", "3.12.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.1
          uv lock --check
          uv lock --project services/mcp/unified-worker --check
          uv sync --locked --python "${{ matrix.python-version }}"
          uv sync --project services/mcp/unified-worker \
            --locked --python "${{ matrix.python-version }}"
      - name: Build and install Dududa package wheel
        run: |
          mkdir -p "$RUNNER_TEMP/dududa-wheel"
          uv build packages/dududa-agent \
            --out-dir "$RUNNER_TEMP/dududa-wheel" \
            --clear
          uv pip install --python .venv/bin/python --reinstall \
            "$RUNNER_TEMP"/dududa-wheel/dududa_agent-*.whl
          uv pip check --python .venv/bin/python
          .venv/bin/python -c 'import importlib.metadata, pathlib, dududa; assert importlib.metadata.version("dududa-agent") == dududa.__version__; assert (pathlib.Path(dududa.__file__).parent / "py.typed").is_file()'
      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q packages apps/astrbot-plugins services/mcp ops/cli tests
      - name: Run repository tests with a low-sensitivity receipt
        run: |
          .venv/bin/python -m dududa.evaluation.suite check \
            evals/suite-v1.json \
            --profile ci-python \
            --receipt "$RUNNER_TEMP/dududa-python-${{ matrix.python-version }}.json"
      - name: Run isolated MCP worker tests
        run: |
          services/mcp/unified-worker/.venv/bin/python \
            -m unittest discover \
            -s services/mcp/unified-worker/tests -v
      - name: Validate shell
        run: |
          bash -n manage.sh ops/manage.sh ops/cli/setup_dev.sh
          sh -n services/mcp/icourse/scripts/setup.sh services/mcp/icourse/scripts/start_mcp.sh
      - name: Validate memory migration entrypoint
        run: |
          test -x ops/cli/migrate_memory_v2.py
          .venv/bin/python ops/cli/migrate_memory_v2.py --help
      - name: Validate Compose
        run: |
          docker compose \
            --project-directory . \
            --env-file .env.example \
            -f deploy/compose/compose.yml \
            config --format json > "$RUNNER_TEMP/dududa-compose.json"
          .venv/bin/python ops/cli/dududa_ops.py compose-contract \
            --input "$RUNNER_TEMP/dududa-compose.json"
      - name: Check repository for secrets and runtime data
        run: .venv/bin/python ops/cli/check_secrets.py

  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked evaluation environment
        run: |
          python -m pip install uv==0.12.1
          uv lock --check
          uv sync --locked --python "3.12.13"
      - name: Verify committed offline evaluation bundles
        run: |
          .venv/bin/python -m dududa.evaluation.suite check \
            evals/suite-v1.json \
            --profile committed-bundles \
            --receipt "$RUNNER_TEMP/dududa-eval-3.12.13.json"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked Web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Run Web unit and contract tests
        working-directory: apps/web
        run: npm test
      - name: Typecheck and build Web
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run build
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Web E2E
        working-directory: apps/web
        run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
