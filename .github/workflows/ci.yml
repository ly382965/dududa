name: Dududa 3.0 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-v3:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked
      - name: Exercise the 3.0 runtime and its transport/service boundaries
        run: uv run python -m unittest discover -s tests/v3 -v
      - name: Exercise isolated campus worker protocols without real credentials
        if: matrix.python-version == '3.12'
        run: uv run --with-requirements packages/dududa-runtime/src/dududa_v3/features/notify/worker-requirements.txt python -m unittest discover -s tests/notify_worker -v
      - name: Prove deterministic routing without Codex installed
        run: uv run dududa-v3 chat /ping
      - run: uv run ruff check --no-cache packages/dududa-runtime/src tests/v3 tests/notify_worker ops/cli/verify_dududa_v3.py
      # Authenticated model acceptance is explicit and local:
      # uv run python ops/cli/verify_dududa_v3.py
      # CI protocol fakes are not evidence of a real model run.

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
