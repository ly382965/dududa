[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ustc-notice-mcp"
version = "0.1.0"
description = "MCP server for public notices published by USTC Office of Academic Affairs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "mcp>=1.2.0,<2",
]

[project.scripts]
ustc-notice-mcp = "ustc_notice_mcp.server:main"
ustc-notice-mcp-cli = "ustc_notice_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]