[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notifai-mcp"
version = "0.1.0"
description = "MCP server for the public NotifAI campus-notice API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "mcp==1.29.0",
]

[project.scripts]
notifai-mcp = "notifai_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
