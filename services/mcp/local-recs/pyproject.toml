[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-recs-mcp"
version = "0.1.0"
description = "MCP server for local USTC campus recommendations (food, activities, study topics)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
]

[project.scripts]
local-recs-mcp = "local_recs_mcp.server:main"
local-recs-mcp-cli = "local_recs_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]