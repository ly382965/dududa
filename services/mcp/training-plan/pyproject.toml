[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-plan-mcp"
version = "0.1.0"
description = "MCP server for the public undergraduate college/major overview published by USTC Academic Affairs Office"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "mcp>=1.2.0,<2",
]

[project.scripts]
training-plan-mcp = "training_plan_mcp.server:main"
training-plan-mcp-cli = "training_plan_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]