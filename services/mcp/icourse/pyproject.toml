[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icourse-mcp"
version = "0.1.0"
description = "MCP server for public structured data from icourse.club"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "mcp>=1.2.0,<2.0.0",
    # MCP 1.29 emits an unresolved lifespan warning with 2.15.x.
    "pydantic-settings>=2.14.2,<2.16.0",
]

[project.scripts]
icourse-mcp = "icourse_mcp.server:main"
icourse-mcp-cli = "icourse_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
