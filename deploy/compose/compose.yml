name: ${COMPOSE_PROJECT_NAME:-dududa}

services:
  web:
    build:
      context: .
      dockerfile: deploy/docker/web/Dockerfile
    image: ${DUDUDA_WEB_IMAGE:-dududa/web:local}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DUDUDA_WEB_BIND: 0.0.0.0
      DUDUDA_WEB_INTERNAL_PORT: 8000
      DUDUDA_WEB_PUBLIC_ORIGIN: ${DUDUDA_WEB_PUBLIC_ORIGIN:-}
      DUDUDA_ONEBOT_TOKEN_FILE: /run/secrets/onebot_access_token
      DUDUDA_API_KEY_STORE_PATH: /var/lib/dududa/api-keys/api-keys.json
      DUDUDA_MCP_CONSOLE_URL: http://mcp-console:8090
      DUDUDA_ASTRBOT_PLUGIN_API_URL: http://astrbot:6185/api/v1
      DUDUDA_ASTRBOT_PLUGIN_API_KEY_FILE: /run/secrets/astrbot_plugin_api_key
      DUDUDA_AGENT_POLICY_PATH: /var/lib/dududa/agent/agent-policies.json
    ports:
      - host_ip: ${DUDUDA_WEB_HOST:-127.0.0.1}
        published: "${DUDUDA_WEB_PORT:-5173}"
        target: 8000
        protocol: tcp
    volumes:
      - ${DUDUDA_WEB_DATA_ROOT:-./runtime/web}/secrets/onebot_access_token:/run/secrets/onebot_access_token:ro
      - ${DUDUDA_WEB_DATA_ROOT:-./runtime/web}/secrets/astrbot_plugin_api_key:/run/secrets/astrbot_plugin_api_key:ro
      - ${DUDUDA_API_KEY_STORE_ROOT:-../dududa-state/api-keys}:/var/lib/dududa/api-keys:rw
      - ${DUDUDA_AGENT_POLICY_ROOT:-../dududa-state/agent}:/var/lib/dududa/agent:rw
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      bot_net:
      edge:
        aliases:
          - dududa-web-api
    depends_on:
      - mcp-console

  mcp-console:
    init: true
    build:
      context: .
      dockerfile: deploy/docker/astrbot/Dockerfile
      args:
        ASTRBOT_BASE_IMAGE: ${ASTRBOT_BASE_IMAGE}
    image: ${DUDUDA_ASTRBOT_IMAGE:-dududa/astrbot:local}
    command:
      - /usr/local/bin/python
      - -m
      - dududa_mcp_console
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      DUDUDA_MCP_RUNTIME_OVERLAY_DIR: /var/lib/dududa/mcp/servers
      USTC_CAS_USR: ${USTC_CAS_USR:-}
      USTC_CAS_PWD: ${USTC_CAS_PWD:-}
      USTC_CAS_CREDENTIALS_FILE: /run/secrets/ustc-cas.toml
      NOTIFAI_API_BASE_URL: ${NOTIFAI_API_BASE_URL:-https://notifai-api.enthusjast.cc/api}
      NOTIFAI_API_TIMEOUT_SECONDS: ${NOTIFAI_API_TIMEOUT_SECONDS:-15}
      NOTIFAI_MAX_ITEMS: ${NOTIFAI_MAX_ITEMS:-100}
    volumes:
      - ${STACK_DATA_ROOT:-./data}/astrbot/campus-events-cache:/AstrBot/data/campus-events-cache
      - ${STACK_DATA_ROOT:-./data}/astrbot/college-notice-cache:/AstrBot/data/college-notice-cache
      - ${STACK_DATA_ROOT:-./data}/astrbot/icourse-cache:/AstrBot/data/icourse-cache
      - ${STACK_DATA_ROOT:-./data}/astrbot/library-cache:/AstrBot/data/library-cache
      - ${STACK_DATA_ROOT:-./data}/astrbot/local-recs-cache:/AstrBot/data/local-recs-cache
      - ${STACK_DATA_ROOT:-./data}/astrbot/training-plan-cache:/AstrBot/data/training-plan-cache
      - ./services/mcp/campus-events:/AstrBot/data/campus-events-mcp:ro
      - ./services/mcp/college-notice:/AstrBot/data/college-notice-mcp:ro
      - ./services/mcp/icourse:/AstrBot/data/icourse-mcp:ro
      - ./services/mcp/library:/AstrBot/data/library-mcp:ro
      - ./services/mcp/local-recs:/AstrBot/data/local-recs-mcp:ro
      - ./services/mcp/notifai:/AstrBot/data/notifai-mcp:ro
      - ./services/mcp/training-plan:/AstrBot/data/training-plan-mcp:ro
      - ./services/mcp/ustc-campus:/AstrBot/data/ustc-campus-mcp:ro
      - ./configs:/opt/dududa/config:ro
      - ${DUDUDA_MCP_RUNTIME_ROOT:-./runtime/mcp}:/var/lib/dududa/mcp
      - ${USTC_CAS_CREDENTIALS_FILE_HOST:-${HOME}/Code/ustc-catalog-crawler/credentials.toml}:/run/secrets/ustc-cas.toml:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      bot_net:

  astrbot:
    init: true
    build:
      context: .
      dockerfile: deploy/docker/astrbot/Dockerfile
      args:
        ASTRBOT_BASE_IMAGE: ${ASTRBOT_BASE_IMAGE}
    image: ${DUDUDA_ASTRBOT_IMAGE:-dududa/astrbot:local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: /AstrBot/data/model_cache/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-}
      SUB2API_ADMIN_EMAIL: ${SUB2API_ADMIN_EMAIL:-}
      SUB2API_ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD:-}
      USTC_CAS_USR: ${USTC_CAS_USR:-}
      USTC_CAS_PWD: ${USTC_CAS_PWD:-}
      USTC_CAS_CREDENTIALS_FILE: /run/secrets/ustc-cas.toml
      NOTIFAI_API_BASE_URL: ${NOTIFAI_API_BASE_URL:-https://notifai-api.enthusjast.cc/api}
      NOTIFAI_API_TIMEOUT_SECONDS: ${NOTIFAI_API_TIMEOUT_SECONDS:-15}
      NOTIFAI_MAX_ITEMS: ${NOTIFAI_MAX_ITEMS:-100}
      DUDUDA_API_KEY_STORE_PATH: /run/dududa/api-keys/api-keys.json
      DUDUDA_AGENT_POLICY_PATH: /var/lib/dududa/agent/agent-policies.json
      DUDUDA_EMOJI_KITCHEN_HTTP_PROXY: ${DUDUDA_EMOJI_KITCHEN_HTTP_PROXY:-}
    ports:
      - host_ip: ${ASTRBOT_WEBUI_HOST:-127.0.0.1}
        published: "${ASTRBOT_WEBUI_PORT:-6185}"
        target: 6185
        protocol: tcp
    volumes:
      - ${STACK_DATA_ROOT:-./data}/astrbot:/AstrBot/data
      - ${DUDUDA_ASTRBOT_PLUGIN_ROOT:-./runtime/astrbot-plugins}:/AstrBot/data/plugins
      - ./services/mcp/campus-events:/AstrBot/data/campus-events-mcp:ro
      - ./services/mcp/college-notice:/AstrBot/data/college-notice-mcp:ro
      - ./services/mcp/icourse:/AstrBot/data/icourse-mcp:ro
      - ./services/mcp/library:/AstrBot/data/library-mcp:ro
      - ./services/mcp/local-recs:/AstrBot/data/local-recs-mcp:ro
      - ./services/mcp/notifai:/AstrBot/data/notifai-mcp:ro
      - ./services/mcp/training-plan:/AstrBot/data/training-plan-mcp:ro
      - ./services/mcp/ustc-campus:/AstrBot/data/ustc-campus-mcp:ro
      - ./configs:/opt/dududa/config:ro
      - ./ops/cli:/opt/dududa/scripts:ro
      - ${USTC_CAS_CREDENTIALS_FILE_HOST:-${HOME}/Code/ustc-catalog-crawler/credentials.toml}:/run/secrets/ustc-cas.toml:ro
      - ${DUDUDA_API_KEY_STORE_ROOT:-../dududa-state/api-keys}:/run/dududa/api-keys:ro
      - ${DUDUDA_AGENT_POLICY_ROOT:-../dududa-state/agent}:/var/lib/dududa/agent:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      bot_net:
      edge:
        aliases:
          - dududa-astrbot
          - bot-astrbot-qq-astrbot

  napcat:
    image: ${NAPCAT_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      MODE: astrbot
    ports:
      - host_ip: ${NAPCAT_WEBUI_HOST:-127.0.0.1}
        published: "${NAPCAT_WEBUI_PORT:-6099}"
        target: 6099
        protocol: tcp
    volumes:
      - ${STACK_DATA_ROOT:-./data}/astrbot:/AstrBot/data
      - ${STACK_DATA_ROOT:-./data}/napcat/config:/app/napcat/config
      - ${STACK_DATA_ROOT:-./data}/napcat/ntqq:/app/.config/QQ
      - /etc/localtime:/etc/localtime:ro
    networks:
      bot_net:
      edge:
        aliases:
          - dududa-napcat
          - bot-astrbot-qq-napcat
    depends_on:
      - astrbot

networks:
  bot_net:
    driver: bridge
  edge:
    external: true
    name: ${EDGE_NETWORK:-mmdustc-edge}
