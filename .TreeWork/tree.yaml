version: 1

tree:
  id: root
  title: Dududa S08-S11
  purpose: Deliver integrated deterministic model selection through controlled direct-chat rollout.
  spec: spec.md

  children:
    - id: model-selection
      title: Model Selection Epic
      purpose: Own the shared architecture for task complexity, tier policy, and static endpoint routing.
      spec: branches/model-selection/spec.md
      children:
        - id: selection-contracts
          title: S08 Selection Contracts
          purpose: Freeze versioned tier, complexity projection, endpoint, traffic, and decision contracts.
          spec: branches/selection-contracts/spec.md

        - id: static-router
          title: S08 Static Router
          purpose: Implement deterministic filtering, admission, reliability, registry, Fake, and one compatible Adapter.
          spec: branches/static-router/spec.md
          depends_on:
            - selection-contracts

        - id: perception-tiering
          title: S09 Perception And Tiering
          purpose: Implement validated perception, complexity assessment, deterministic tier policy, social decision, and Eval.
          spec: branches/perception-tiering/spec.md
          depends_on:
            - static-router

    - id: offline-runtime
      title: S10 Offline Runtime
      purpose: Build the explicit-mention direct-chat vertical loop and prove shadow has no side effects.
      spec: branches/offline-runtime/spec.md
      depends_on:
        - perception-tiering

    - id: controlled-rollout
      title: S11 Controlled Rollout
      purpose: Add typed rollout modes, persistent idempotency, canary ownership, kill switch, metrics, and rollback.
      spec: branches/controlled-rollout/spec.md
      depends_on:
        - offline-runtime

    - id: completion-audit
      title: S08-S11 Completion Audit
      purpose: Prove every accepted requirement with cross-stage verification and record external evidence gaps.
      spec: branches/completion-audit/spec.md
      depends_on:
        - controlled-rollout
