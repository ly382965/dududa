version: 1
tree:
  id: root
  title: Dududa Runtime And Operator Client
  purpose: >-
    Deliver the deterministic Agent runtime and a real NapCat-backed multi-account
    QQ operator client.
  spec: spec.md
  children:
  - id: model-selection
    title: Model Selection Epic
    purpose: >-
      Own the shared architecture for task complexity, tier policy, and static
      endpoint routing.
    spec: branches/model-selection/spec.md
    children:
    - id: selection-contracts
      title: S08 Selection Contracts
      purpose: >-
        Freeze versioned tier, complexity projection, endpoint, traffic, and decision
        contracts.
      spec: branches/model-selection/selection-contracts/spec.md
    - id: static-router
      title: S08 Static Router
      purpose: >-
        Implement deterministic filtering, admission, reliability, registry, Fake, and
        one compatible Adapter.
      spec: branches/model-selection/static-router/spec.md
      depends_on:
      - selection-contracts
    - id: perception-tiering
      title: S09 Perception And Tiering
      purpose: >-
        Implement validated perception, complexity assessment, deterministic tier
        policy, social decision, and Eval.
      spec: branches/model-selection/perception-tiering/spec.md
      depends_on:
      - static-router
  - id: offline-runtime
    title: S10 Offline Runtime
    purpose: >-
      Build the explicit-mention direct-chat vertical loop and prove shadow has no
      side effects.
    spec: branches/offline-runtime/spec.md
    depends_on:
    - perception-tiering
  - id: controlled-rollout
    title: S11 Controlled Rollout
    purpose: >-
      Add typed rollout modes, persistent idempotency, canary ownership, kill switch,
      metrics, and rollback.
    spec: branches/controlled-rollout/spec.md
    depends_on:
    - offline-runtime
  - id: completion-audit
    title: S08-S11 Completion Audit
    purpose: >-
      Prove every accepted requirement with cross-stage verification and record
      external evidence gaps.
    spec: branches/completion-audit/spec.md
    depends_on:
    - controlled-rollout
  - id: mew-parity
    title: Mew And NapCat Web Parity
    purpose: >-
      Reproduce the Mew QQ-client surface over Dududa's real multi-account NapCat
      backend.
    spec: branches/mew-parity/spec.md
    children:
    - id: mew-parity-foundation
      title: NapCat Web Foundation
      purpose: >-
        Establish account-scoped rich-message, capability, cursor-history and
        persistence contracts.
      spec: branches/mew-parity/mew-parity-foundation/spec.md
    - id: mew-chat-parity
      title: Mew Chat Parity
      purpose: >-
        Port Mew chat rendering, composition, history, search, drafts and message
        actions to NapCat.
      spec: branches/mew-parity/mew-chat-parity/spec.md
      depends_on:
      - mew-parity-foundation
    - id: mew-directory-parity
      title: Mew Directory And Group Parity
      purpose: >-
        Port contacts, notifications, group management, resources and settings with
        capability gating.
      spec: branches/mew-parity/mew-directory-parity/spec.md
      depends_on:
      - mew-parity-foundation
    - id: mew-parity-audit
      title: Mew Parity Audit
      purpose: >-
        Prove real NapCat multi-account behavior, security and desktop/mobile Mew
        parity.
      spec: branches/mew-parity/mew-parity-audit/spec.md
      depends_on:
      - mew-chat-parity
      - mew-directory-parity
  - id: agent-expansion
    title: Offline Agent Expansion
    purpose: >-
      Complete the governed S12-S22 and bounded S20 engineering chain before any
      real-group validation.
    spec: branches/agent-expansion/spec.md
    children:
    - id: production-shape
      title: S12 Entry Gate Production Shape
      purpose: >-
        Make the existing runtime safely composable, default-off and reproducible
        without enabling a real Endpoint.
      spec: branches/agent-expansion/production-shape/spec.md
      depends_on:
      - completion-audit
    - id: semantic-contract
      title: S09 Additive Semantic Contract
      purpose: >-
        Add span, entity, reference and explicit uncertainty contracts with a
        synthetic Schema pilot.
      spec: branches/agent-expansion/semantic-contract/spec.md
      depends_on:
      - production-shape
    - id: mcp-v2-spike
      title: S12A MCP V2 Spike
      purpose: >-
        Decide MCP v2 adoption using iCourse compatibility and isolated Fake
        lifecycle evidence.
      spec: branches/agent-expansion/mcp-v2-spike/spec.md
      depends_on:
      - semantic-contract
    - id: unified-mcp
      title: S12 Unified MCP
      purpose: >-
        Implement one Core-owned multi-Server Client and Registry with iCourse as
        the sole real compatibility Adapter.
      spec: branches/agent-expansion/unified-mcp/spec.md
      depends_on:
      - mcp-v2-spike
    - id: bounded-capability
      title: S13 Bounded Capability Runtime
      purpose: >-
        Map explicitly authorized business Capabilities to governed Provider calls
        and bounded Observations.
      spec: branches/agent-expansion/bounded-capability/spec.md
      depends_on:
      - unified-mcp
    - id: memory-retrieval
      title: S14 Memory Lifecycle And Retrieval
      purpose: >-
        Complete Memory administration, deletion and lexical retrieval without
        weakening Scope authority.
      spec: branches/agent-expansion/memory-retrieval/spec.md
      depends_on:
      - bounded-capability
    - id: response-persona
      title: S15 Response Profile And Persona
      purpose: >-
        Add deterministic short, medium and long Response Plans with fact-preserving
        composition and rendering.
      spec: branches/agent-expansion/response-persona/spec.md
      depends_on:
      - memory-retrieval
    - id: proactive-outbound
      title: S15A-S15E Controlled Proactive Outbound
      purpose: >-
        Build the default-off initiated-run, scheduling, source and no-send Shadow
        sequence.
      spec: branches/agent-expansion/proactive-outbound/spec.md
      children:
      - id: proactive-contracts
        title: S15A Proactive Contracts
        purpose: >-
          Freeze target-bound initiation, authorization, preview, dispatch and
          reconciliation contracts.
        spec: branches/agent-expansion/proactive-outbound/proactive-contracts/spec.md
        depends_on:
        - response-persona
      - id: durable-scheduler
        title: S15B Durable Scheduler
        purpose: >-
          Materialize time-zone-aware occurrences and durable single-owner claims
          under an injected clock.
        spec: branches/agent-expansion/proactive-outbound/durable-scheduler/spec.md
        depends_on:
        - proactive-contracts
      - id: governed-sources
        title: S15C Governed Source Contracts
        purpose: >-
          Define source-neutral contracts and prove them with fixed fixtures rather
          than fictitious live MCP Servers.
        spec: branches/agent-expansion/proactive-outbound/governed-sources/spec.md
        depends_on:
        - durable-scheduler
      - id: digest-shadow
        title: S15D Digest Shadow
        purpose: >-
          Compose fixture-backed scheduled digests in a recommendation-only runtime
          with no delivery capability.
        spec: branches/agent-expansion/proactive-outbound/digest-shadow/spec.md
        depends_on:
        - governed-sources
      - id: probe-shadow
        title: S15E Probe Shadow
        purpose: >-
          Detect bounded group-level opportunities and prove the no-send proactive
          policy against synthetic conversations.
        spec: branches/agent-expansion/proactive-outbound/probe-shadow/spec.md
        depends_on:
        - digest-shadow
    - id: operations-hardening
      title: S16 Operations Hardening
      purpose: >-
        Prove health, backup, restore, upgrade and rollback from a versioned release
        manifest.
      spec: branches/agent-expansion/operations-hardening/spec.md
      depends_on:
      - probe-shadow
    - id: layout-migration
      title: S17 Layout Migration
      purpose: >-
        Move repository surfaces incrementally while preserving compatibility and a
        recoverable previous release.
      spec: branches/agent-expansion/layout-migration/spec.md
      depends_on:
      - operations-hardening
    - id: evaluation-ci
      title: S18 Evaluation And CI
      purpose: >-
        Unify versioned fixtures, traces, fault injection and reproducible repository
        verification.
      spec: branches/agent-expansion/evaluation-ci/spec.md
      depends_on:
      - layout-migration
    - id: local-integration-audit
      title: S19 Local Integration Audit
      purpose: >-
        Prove the complete release-required offline chain and freeze its rollback
        evidence without real traffic.
      spec: branches/agent-expansion/local-integration-audit/spec.md
      depends_on:
      - evaluation-ci
    - id: legacy-cleanup
      title: S22 Evidence-Based Legacy Cleanup
      purpose: >-
        Remove only compatibility surfaces whose consumers have migrated and whose
        previous release remains independently recoverable.
      spec: branches/agent-expansion/legacy-cleanup/spec.md
      depends_on:
      - local-integration-audit
    - id: bandit-offline
      title: S20 Offline Bandit Foundation
      purpose: >-
        Add replayable same-role and same-tier decision, support and estimator
        contracts without training or exploration.
      spec: branches/agent-expansion/bandit-offline/spec.md
      depends_on:
      - legacy-cleanup
    - id: control-plane
      title: S21 Bot Control Plane
      purpose: >-
        Establish governed group-service initialization and operator control before
        any real-group validation.
      spec: branches/agent-expansion/control-plane/spec.md
      children:
      - id: control-plane-foundation
        title: S21A Control Plane Foundation
        purpose: >-
          Define the framework-neutral profile, assignment, operator command and
          projection foundation over Fake group and service facts.
        spec: branches/agent-expansion/control-plane/control-plane-foundation/spec.md
        depends_on:
        - legacy-cleanup
        - mew-parity-audit
      - id: group-onboarding
        title: S21B Group Onboarding
        purpose: >-
          Let an authorized administrator preview and activate one initial group
          service profile with immutable Runtime assignment and recovery.
        spec: branches/agent-expansion/control-plane/group-onboarding/spec.md
        depends_on:
        - control-plane-foundation
      - id: governed-operations
        title: S21C Governed Operations
        purpose: >-
          Expose authoritative operational projections and only the existing typed
          Core mutations through the Control Plane.
        spec: branches/agent-expansion/control-plane/governed-operations/spec.md
        depends_on:
        - group-onboarding
      - id: control-plane-audit
        title: S21 Completion Audit
        purpose: >-
          Prove isolation, recovery and governed Agent operations while removing
          browser-local authority and direct-NapCat Agent delivery.
        spec: branches/agent-expansion/control-plane/control-plane-audit/spec.md
        depends_on:
        - governed-operations
    - id: pr10-selective-integration
      title: PR10 Selective Plugin And MCP Integration
      purpose: >-
        Extract only non-duplicate PR10 capabilities into canonical, default-off
        plugin and Unified MCP boundaries while preserving the existing Core and
        deployment composition.
      spec: branches/agent-expansion/pr10-selective-integration/spec.md
      depends_on:
      - control-plane-audit
    - id: api-key-pools
      title: Three-Tier LLM API Key Pools
      purpose: >-
        Add an independent Web credential workbench and server-side SecretRef-backed
        pools for the three Dududa reasoning tiers without changing tier policy,
        Runtime authority or existing Provider contracts.
      spec: branches/agent-expansion/api-key-pools/spec.md
      depends_on:
      - control-plane-audit
    - id: real-group-validation
      title: S23 Authorized Real-Group Validation
      purpose: >-
        Run separately authorized inbound, digest and probe canaries only after every
        release-required local gate is complete.
      spec: branches/agent-expansion/real-group-validation/spec.md
      depends_on:
      - legacy-cleanup
      - mew-parity-audit
      - control-plane-audit
