name: astrbot_plugin_proactive_chatter
display_name: 主动搭话上下文策略
desc: 为嘟嘟哒 2.0 Runtime 提供复读、接龙和其他机器人互动场景的静默策略。
help: |
  本插件仅提供无副作用的上下文策略，不监听消息、不调用模型或 MCP，也不自行发送消息。
  主动搭话的启用、概率、冷却、上下文长度和每小时上限由嘟嘟哒 2.0 管理后台统一配置。
version: v0.2.0
author: mmdustc
repo: https://github.com/ly382965/dududa/tree/main/apps/astrbot-plugins/astrbot_plugin_proactive_chatter
support_platforms:
  - aiocqhttp
