name: astrbot_plugin_target_talk
display_name: 定向搭话（历史兼容）
desc: Dududa 1.0 历史兼容插件；2.0 默认关闭，不进入默认 Compose。
help: |
  仅在明确需要兼容旧行为时手动启用，并在插件配置页添加目标 QQ 号。
  插件为被动触发模式：目标用户先在群里发言，命中概率、冷却和过滤条件后，Bot 会 @ 该用户并回复。
version: v0.1.0
author: mmdustc
repo: https://github.com/ly382965/dududa/tree/main/apps/astrbot-plugins/astrbot_plugin_target_talk
support_platforms:
  - aiocqhttp
