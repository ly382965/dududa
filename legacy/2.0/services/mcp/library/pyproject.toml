[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "library-mcp"
version = "0.1.0"
description = "MCP server for public USTC library opening hours published on lib.ustc.edu.cn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "mcp>=1.2.0,<2",
]

[project.scripts]
library-mcp = "library_mcp.server:main"
library-mcp-cli = "library_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]