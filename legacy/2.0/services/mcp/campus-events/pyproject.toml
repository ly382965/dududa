[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-events-mcp"
version = "0.1.0"
description = "MCP server for public USTC campus notice aggregates (teaching/research/admin)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "mcp>=1.2.0,<2",
]

[project.scripts]
campus-events-mcp = "campus_events_mcp.server:main"
campus-events-mcp-cli = "campus_events_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]