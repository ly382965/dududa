<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <title>Dududa 3.0 架构：规则服务与 Codex Harness</title>
  <desc>四比三架构图。左侧 QQ、Web 和定时事件进入身份校验与规则分流。上方规则服务不使用 LLM；下方由宿主管理 Agent 会话并调用 Codex Harness。两路结果经过统一投递，在右侧输出。底部业务服务由规则直接调用或由 Codex 通过 MCP 调用。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8593a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#25816c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5274ca" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', sans-serif; fill: #233348; }
      .heading { font-size: 31px; font-weight: 700; }
      .label { font-size: 27px; font-weight: 500; }
      .small { font-size: 24px; fill: #66768b; }
      .tiny { font-size: 22px; fill: #66768b; }
      .center { text-anchor: middle; }
      .edge { fill: none; stroke: #8593a7; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .rule-edge { fill: none; stroke: #25816c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#green); }
      .agent-edge { fill: none; stroke: #5274ca; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#blue); }
      .dependency { fill: none; stroke: #8593a7; stroke-width: 2; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#f8fafc"/>
  <text x="64" y="88" font-size="48" font-weight="700">Dududa 3.0</text>
  <text x="64" y="136" font-size="28" fill="#66768b">规则服务与 Codex Harness</text>
  <path d="M64 176H1536" stroke="#dce3ec" stroke-width="1.5"/>

  <text x="160" y="230" class="label center">输入</text>
  <text x="400" y="230" class="label center">入口与分流</text>
  <text x="800" y="230" class="label center">双路径执行</text>
  <text x="1190" y="230" class="label center">统一投递</text>
  <text x="1440" y="230" class="label center">输出</text>

  <!-- Shared-service dependency, routed outside the execution cards. -->
  <path d="M640 450V482Q640 494 628 494H536Q524 494 524 506V958Q524 976 542 976H600" class="dependency"/>
  <rect x="435" y="838" width="180" height="46" rx="12" fill="#f8fafc"/>
  <text x="525" y="870" class="small center">直接调用</text>

  <!-- Main flow: left to right. -->
  <path d="M256 525H310" class="edge"/>
  <path d="M490 470H540Q554 470 554 456V370Q554 356 568 356H600" class="rule-edge"/>
  <path d="M490 580H600" stroke="#f8fafc" stroke-width="12" fill="none"/>
  <path d="M490 580H600" class="agent-edge"/>
  <path d="M1000 356H1036Q1052 356 1052 372V454Q1052 470 1068 470H1100" class="rule-edge"/>
  <path d="M1000 732H1036Q1052 732 1052 716V596Q1052 580 1068 580H1100" class="agent-edge"/>
  <path d="M1280 525H1344" class="edge"/>

  <!-- Input column. -->
  <rect x="64" y="388" width="192" height="274" rx="22" fill="#ffffff" stroke="#dce3ec" stroke-width="1.5"/>
  <text x="160" y="449" class="heading center">QQ 消息</text>
  <path d="M88 479H232" stroke="#e8edf3"/>
  <text x="160" y="526" class="label center">Web 请求</text>
  <path d="M88 556H232" stroke="#e8edf3"/>
  <text x="160" y="601" class="label center">定时事件</text>
  <text x="160" y="636" class="tiny center">预留接入</text>

  <!-- Host input controller. -->
  <rect x="310" y="402" width="180" height="246" rx="22" fill="#eef2f7"/>
  <text x="400" y="455" class="heading center">Dududa</text>
  <text x="400" y="494" class="label center">Host</text>
  <path d="M340 521H460" stroke="#d3dce7"/>
  <text x="400" y="562" class="small center">身份 · 权限</text>
  <text x="400" y="605" class="small center">去重 · 分流</text>

  <!-- Deterministic path. -->
  <rect x="600" y="282" width="400" height="168" rx="24" fill="#eaf5ef" stroke="#cfe6d9" stroke-width="1.5"/>
  <rect x="627" y="305" width="6" height="33" rx="3" fill="#25816c"/>
  <text x="650" y="332" class="heading">规则处理器</text>
  <text x="631" y="381" class="label">参数解析 · 业务调用</text>
  <text x="631" y="422" class="small">模板回复 · 无需 LLM</text>

  <!-- Agent path: host session manager plus external Codex runtime. -->
  <rect x="600" y="532" width="400" height="96" rx="20" fill="#eef2f7"/>
  <text x="800" y="572" class="label center">Host · Agent 会话</text>
  <text x="800" y="608" class="small center">参与策略 · 人格 · 上下文</text>
  <path d="M800 628V669" class="agent-edge"/>
  <text x="824" y="659" class="tiny">CLI / App Server</text>
  <rect x="600" y="678" width="400" height="154" rx="24" fill="#edf2fe" stroke="#d2ddf7" stroke-width="1.5"/>
  <rect x="627" y="702" width="6" height="33" rx="3" fill="#5274ca"/>
  <text x="650" y="729" class="heading">Codex Harness</text>
  <text x="631" y="773" class="label">理解 · 规划 · 工具循环</text>
  <text x="631" y="810" class="small">多轮对话 · 任务执行</text>

  <!-- Delivery controller. -->
  <rect x="1100" y="402" width="180" height="246" rx="22" fill="#eef2f7"/>
  <text x="1190" y="455" class="heading center">结果投递</text>
  <text x="1190" y="497" class="small center">平台适配器</text>
  <path d="M1130 521H1250" stroke="#d3dce7"/>
  <text x="1190" y="562" class="small center">文本 · 消息</text>
  <text x="1190" y="605" class="small center">投递 · 去重</text>

  <!-- Output column. -->
  <rect x="1344" y="388" width="192" height="274" rx="22" fill="#ffffff" stroke="#dce3ec" stroke-width="1.5"/>
  <text x="1440" y="449" class="heading center">QQ 回复</text>
  <text x="1440" y="489" class="small center">群聊 / 私聊</text>
  <path d="M1368 521H1512" stroke="#e8edf3"/>
  <text x="1440" y="568" class="label center">Web 展示</text>
  <text x="1440" y="610" class="small center">预览 · 结果</text>

  <!-- Shared domain services. -->
  <path d="M800 832V934" class="dependency"/>
  <rect x="821" y="861" width="178" height="43" rx="10" fill="#f8fafc"/>
  <text x="829" y="891" class="small">MCP 调用</text>
  <rect x="600" y="942" width="400" height="142" rx="24" fill="#ffffff" stroke="#dce3ec" stroke-width="1.5"/>
  <text x="800" y="986" class="heading center">共享业务服务</text>
  <text x="800" y="1028" class="small center">校车查询 · 公开校园</text>
  <text x="800" y="1065" class="small center">会话上下文 · 显式记忆</text>

  <!-- Minimal legend and state ownership. -->
  <path d="M64 1130H1536" stroke="#dce3ec" stroke-width="1.5"/>
  <path d="M64 1166H114" class="edge"/>
  <text x="132" y="1174" class="tiny">消息与结果</text>
  <path d="M320 1166H370" class="dependency"/>
  <text x="388" y="1174" class="tiny">业务调用</text>
  <text x="1536" y="1174" class="tiny" text-anchor="end">Host 持久化：会话映射 · 任务状态 · 投递记录</text>
</svg>
