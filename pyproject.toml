[project]
name = "dududa-workspace"
version = "3.0.0"
description = "Dududa 3.0 local Codex harness and rule-service workspace"
requires-python = ">=3.10,<3.13"
dependencies = ["dududa-runtime"]

[dependency-groups]
dev = ["ruff>=0.12,<1.0"]

[tool.uv]
package = false

[tool.uv.sources]
dududa-runtime = { workspace = true }

[tool.uv.workspace]
members = ["packages/dududa-runtime"]
exclude = ["legacy/2.0", "services/mcp/*"]
