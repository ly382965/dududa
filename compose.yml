name: ${COMPOSE_PROJECT_NAME:-dududa}

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: ${DUDUDA_WEB_IMAGE:-dududa/web:local}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DUDUDA_WEB_BIND: 0.0.0.0
      DUDUDA_WEB_INTERNAL_PORT: 8000
      DUDUDA_ONEBOT_TOKEN_FILE: /run/secrets/onebot_access_token
    ports:
      - host_ip: ${DUDUDA_WEB_HOST:-127.0.0.1}
        published: "${DUDUDA_WEB_PORT:-5173}"
        target: 8000
        protocol: tcp
    volumes:
      - ${DUDUDA_WEB_DATA_ROOT:-./runtime/web}/secrets/onebot_access_token:/run/secrets/onebot_access_token:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      bot_net:
      edge:
        aliases:
          - dududa-web-api

  astrbot:
    init: true
    build:
      context: .
      dockerfile: docker/astrbot/Dockerfile
      args:
        ASTRBOT_BASE_IMAGE: ${ASTRBOT_BASE_IMAGE}
    image: ${DUDUDA_ASTRBOT_IMAGE:-dududa/astrbot:local}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: /AstrBot/data/model_cache/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      ICOURSE_MCP_DB_PATH: /AstrBot/data/icourse-cache/icourse.sqlite3
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-}
      SUB2API_ADMIN_EMAIL: ${SUB2API_ADMIN_EMAIL:-}
      SUB2API_ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD:-}
    ports:
      - host_ip: ${ASTRBOT_WEBUI_HOST:-127.0.0.1}
        published: "${ASTRBOT_WEBUI_PORT:-6185}"
        target: 6185
        protocol: tcp
    volumes:
      - ${STACK_DATA_ROOT:-./data}/astrbot:/AstrBot/data
      - ./plugins/astrbot_plugin_dududa_core:/AstrBot/data/plugins/astrbot_plugin_dududa_core:ro
      - ./plugins/astrbot_plugin_reply_polish:/AstrBot/data/plugins/astrbot_plugin_reply_polish:ro
      - ./plugins/astrbot_plugin_target_talk:/AstrBot/data/plugins/astrbot_plugin_target_talk:ro
      - ./plugins/astrbot_plugin_sub2api_readonly:/AstrBot/data/plugins/astrbot_plugin_sub2api_readonly:ro
      - ./services/icourse-mcp:/AstrBot/data/icourse-mcp:ro
      - ./config:/opt/dududa/config:ro
      - ./scripts:/opt/dududa/scripts:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      bot_net:
      edge:
        aliases:
          - dududa-astrbot
          - bot-astrbot-qq-astrbot

  napcat:
    image: ${NAPCAT_IMAGE}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      MODE: astrbot
    ports:
      - host_ip: ${NAPCAT_WEBUI_HOST:-127.0.0.1}
        published: "${NAPCAT_WEBUI_PORT:-6099}"
        target: 6099
        protocol: tcp
    volumes:
      - ${STACK_DATA_ROOT:-./data}/astrbot:/AstrBot/data
      - ${STACK_DATA_ROOT:-./data}/napcat/config:/app/napcat/config
      - ${STACK_DATA_ROOT:-./data}/napcat/ntqq:/app/.config/QQ
      - /etc/localtime:/etc/localtime:ro
    networks:
      bot_net:
      edge:
        aliases:
          - dududa-napcat
          - bot-astrbot-qq-napcat
    depends_on:
      - astrbot

networks:
  bot_net:
    driver: bridge
  edge:
    external: true
    name: ${EDGE_NETWORK:-mmdustc-edge}
