name: astrbot_plugin_weather_scheduler
display_name: 天气定时播报
desc: 每天早上 8 点向已加入群播报当天天气；指定群播报广东梅州兴宁，其余群播报合肥。
help: |
  插件启动后记录给它发过消息的群，每天 08:00(北京时间) 向这些群推送天气。
  配置项 xingning_groups 为兴宁播报群列表(默认 901226396)。
version: v0.1.0
author: mmdustc
repo: https://github.com/ly382965/dududa/tree/main/apps/astrbot-plugins/astrbot_plugin_weather_scheduler
support_platforms:
  - aiocqhttp
