name: astrbot_plugin_weather
display_name: 天气数据适配器
desc: 为 Dududa 2.0 Runtime 提供按城市显式调用的只读天气数据，不自行调度或发送消息。
short_desc: Dududa 2.0 只读天气 Source/Capability 资产。
help: |
  本插件不注册消息命令或被动监听器。
  天气查询由 Dududa 2.0 Runtime 通过受治理 Capability 调用，调用时必须显式提供城市。
version: v2.0.0
author: mmdustc
repo: https://github.com/ly382965/dududa/tree/main/apps/astrbot-plugins/astrbot_plugin_weather
astrbot_version: ">=4.26.2,<5"
support_platforms:
  - aiocqhttp
